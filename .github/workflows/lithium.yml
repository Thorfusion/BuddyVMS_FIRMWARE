name: CC2 Lithium firmware

on:
  push:
    branches: [main]
    tags: ['lithium-v*']
    paths: ['lithium/**', '.github/workflows/lithium.yml']
  pull_request:
    paths: ['lithium/**', '.github/workflows/lithium.yml']
  workflow_dispatch:
    inputs:
      publish_r2:
        description: Publish verified firmware to the lithium R2 channel only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compile and verify SDCC firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build_id: ${{ steps.version.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install SDCC and pinned uCsim 0.9.9
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sdcc
          if dpkg-query -W -f='${Status}' sdcc-ucsim 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get remove --yes sdcc-ucsim
          fi
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/ucsim.deb" https://github.com/danieldrotos/ucsim/releases/download/ucsim-0.9.9/ucsim_0.9.9_amd64.deb
          echo "3e9b99902060169efb42c5fd7e445ffa8c022e402981ff092f726dd627b10b96  $RUNNER_TEMP/ucsim.deb" | sha256sum --check
          sudo apt-get install --yes "$RUNNER_TEMP/ucsim.deb"
          sdcc --version
          s51 -v
      - name: Generate build ID
        id: version
        shell: bash
        run: echo "build_id=$(TZ=Europe/Oslo date +%Y%m%d-%H%M%S).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build and test operational, SAFE and simulator images
        shell: pwsh
        env:
          BUILD_ID: ${{ steps.version.outputs.build_id }}
        run: |
          ./lithium/tools/make_release.ps1 -BuildId $env:BUILD_ID -SkipDesktop -OutputDirectory "$env:GITHUB_WORKSPACE/ci-output/verified"
      - name: Package the lithium download channel
        run: python lithium/tools/r2_channel.py package --verified ci-output/verified --output ci-output/channel
      - name: Record flash space
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          info = json.load(open('ci-output/verified/build.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"## CC2 Lithium {info['build_id']}\n")
              stream.write(f"P-Flash: {info['p_used']:,} used, {info['p_free']:,} free of {info['p_capacity']:,} bytes.\n\n")
              stream.write('D-Flash: 0 used, 4,096 bytes free.\n\n')
              stream.write('Linked SDCC simulator and offline schema tests passed. Desktop integration and physical hardware were not tested by this run.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc2-lithium-${{ steps.version.outputs.build_id }}
          path: ci-output/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish lithium channel to R2
    needs: build
    if: >-
      github.repository == 'Thorfusion/BuddyVMS_FIRMWARE' &&
      (startsWith(github.ref, 'refs/tags/lithium-v') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_r2))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cc2-lithium-r2-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cc2-lithium-${{ needs.build.outputs.build_id }}
          path: ci-output
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3
      - name: Publish verified immutable files, then latest manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: python lithium/tools/r2_channel.py publish --channel ci-output/channel
